<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosa spetta a te – Papillon Verde</title>
<meta name="description" content="Rispondi a 6 domande e scopri quali bonus, sconti e rimborsi possono spettarti nel 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --crema:#F4F1E7; --carta:#FFFDF7; --ink:#141513; --verde:#1E9C5A; --verde-scuro:#14703F; --oro:#F5C518;
        --oro-chiaro:#FFF4CF; --grigio:#5E5A52; --linea:#E2DDCF; --rosso:#B4442E; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font:16px/1.5 Inter, "Helvetica Neue", Arial, sans-serif; color:var(--ink); background:var(--crema); -webkit-font-smoothing:antialiased; }
main { max-width:560px; margin:0 auto; padding:24px 16px 64px; }
h1, h2, h3, .btn, .cifra { font-family:Poppins, Inter, sans-serif; letter-spacing:-.01em; }
h1 { font-size:clamp(30px, 8vw, 40px); line-height:1.05; }
h1 em, h2 em { font-style:normal; color:var(--verde); }
h2 { font-size:24px; line-height:1.15; }
p.sotto { color:var(--grigio); margin-top:10px; }
.occhiello { font:700 12px/1 Poppins, sans-serif; letter-spacing:.16em; text-transform:uppercase; color:var(--verde); }
.card { background:var(--carta); border:1.5px solid var(--linea); border-radius:22px; padding:22px 18px; margin-top:18px; }
.btn { display:block; width:100%; border:0; border-radius:16px; padding:17px 18px; font-size:18px; font-weight:700; cursor:pointer;
       background:var(--verde); color:#fff; text-align:center; text-decoration:none; margin-top:18px; }
.btn:active { transform:translateY(1px); }
.btn.oro { background:var(--oro); color:var(--ink); }
.btn.vuoto { background:transparent; color:var(--verde-scuro); border:2px solid var(--verde); }
.btn[disabled] { opacity:.4; cursor:default; }
.passi { display:grid; gap:10px; margin-top:16px; }
.passi div { display:flex; gap:12px; align-items:flex-start; }
.passi b { flex:none; width:30px; height:30px; border-radius:50%; background:var(--oro); display:grid; place-items:center; font:700 15px Poppins; }
.progresso { height:6px; background:var(--linea); border-radius:9px; overflow:hidden; margin-bottom:18px; }
.progresso i { display:block; height:100%; background:var(--verde); width:0; transition:width .25s; }
.scelte { display:grid; gap:10px; margin-top:16px; }
.scelta { display:flex; gap:12px; align-items:center; width:100%; text-align:left; font:500 16px/1.3 Inter, sans-serif; color:var(--ink);
          background:#fff; border:2px solid var(--linea); border-radius:14px; padding:14px; cursor:pointer; }
.scelta .segno { flex:none; width:22px; height:22px; border-radius:50%; border:2px solid var(--linea); }
.scelta.multi .segno { border-radius:6px; }
.scelta[aria-pressed="true"] { border-color:var(--verde); background:#EEF8F1; }
.scelta[aria-pressed="true"] .segno { border-color:var(--verde); background:var(--verde); box-shadow:inset 0 0 0 3px #EEF8F1; }
.indietro { background:none; border:0; color:var(--grigio); font:500 15px Inter; margin-top:14px; cursor:pointer; padding:6px 0; }
.voce { border-top:1.5px solid var(--linea); padding:14px 0; }
.voce:first-child { border-top:0; }
.voce .testa { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
.voce h3 { font-size:17px; line-height:1.25; }
.cifra { color:var(--verde-scuro); font-size:15px; font-weight:700; margin-top:4px; }
.etichetta { flex:none; font:600 12px/1 Inter; padding:6px 8px; border-radius:99px; background:#EEF8F1; color:var(--verde-scuro); }
.etichetta.controlla { background:var(--oro-chiaro); color:#7A5B00; }
.chiuso { position:relative; margin-top:10px; padding:12px; border-radius:12px; background:repeating-linear-gradient(135deg,#F1EDE1 0 8px,#ECE7D9 8px 16px); color:var(--grigio); font-size:14px; }
.nota { font-size:13px; color:var(--grigio); margin-top:14px; }
.riquadro { background:var(--oro-chiaro); border-radius:14px; padding:14px; margin-top:16px; font-size:15px; }
.dettagli dt { font-weight:700; margin-top:10px; font-size:14px; color:var(--verde-scuro); }
.dettagli dd { font-size:15px; }
.dettagli ol { margin:6px 0 0 20px; }
.fonti { font-size:13px; margin-top:8px; }
.fonti a { color:var(--verde-scuro); word-break:break-word; }
.lettera { background:#fff; border:1.5px solid var(--linea); border-radius:14px; padding:16px; margin-top:14px; font-size:14.5px; }
.lettera p { margin-top:8px; }
.cal div { display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--linea); font-size:15px; }
.cal div:first-child { border-top:0; }
.cal b { flex:none; width:120px; color:var(--verde-scuro); font-size:14px; }
input[type=text] { width:100%; font:16px Inter, sans-serif; padding:14px; border:2px solid var(--linea); border-radius:12px; margin-top:8px; background:#fff; }
label { display:block; font-weight:600; margin-top:14px; }
.piccolo { font-size:13px; color:var(--grigio); }
footer { text-align:center; font-size:12.5px; color:var(--grigio); margin-top:30px; }
@media print {
  body { background:#fff; } main { max-width:none; padding:0; }
  .no-stampa { display:none !important; }
  .card { break-inside:avoid; border-color:#ccc; }
  .voce, .lettera { break-inside:avoid; }
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="dati.js"></script>
<script src="config.js"></script>
<script>
"use strict";
// Le risposte restano solo su questo telefono (localStorage): il sito non manda niente a nessuno.
const CHIAVE_SALVATAGGIO = "cosa-spetta-a-te-risposte";
const DOMANDE = [
  { id:"eta", titolo:"Quanti anni hai?", scelte:[["u20","Meno di 20"],["20_30","Tra 20 e 30"],["31_64","Tra 31 e 64"],["65_74","Tra 65 e 74"],["75","75 o più"]] },
  { id:"persone", titolo:"Quante persone ci sono nel tuo stato di famiglia, te compreso?", sotto:"Quelle che vivono con te e risultano all'anagrafe.",
    scelte:[["1","Solo io"],["2","2"],["3","3"],["4","4 o più"]] },
  { id:"figli", titolo:"Figli: cosa vale per te?", sotto:"Puoi sceglierne più di una.", multi:true,
    scelte:[["minori","Ho figli minorenni"],["sotto3","Ho un bambino sotto i 3 anni"],["tra3e5","Ho un bambino tra 3 e 5 anni"],
            ["nato_2526","Un figlio nato o adottato nel 2025 o nel 2026"],["nido","Pago la retta di un asilo nido"],["quattro","Ho almeno 4 figli a carico"],["nessuno","Niente di questo"]] },
  { id:"isee", titolo:"Il tuo Isee più recente?", sotto:"Se non lo sai o non l'hai mai fatto, va bene lo stesso: te lo diciamo noi.",
    scelte:[["9796","Sotto 9.796 €"],["11600","Tra 9.796 e 11.600 €"],["15000","Tra 11.600 e 15.000 €"],["22000","Tra 15.000 e 22.000 €"],
            ["40000","Tra 22.000 e 40.000 €"],["oltre","Oltre 40.000 €"],["no","Non lo so / non l'ho fatto"]] },
  { id:"studio", titolo:"Studi all'università?", scelte:[["uni","Sì"],["no","No"]] },
  { id:"evento", titolo:"Negli ultimi 2 anni ti è successo qualcosa di questo?", sotto:"Puoi sceglierne più di una.", multi:true,
    scelte:[["volo","Un volo arrivato con 3 ore o più di ritardo"],["treno","Un treno arrivato con 1 ora o più di ritardo"],
            ["bollette","Una bolletta con consumi di più di 2 anni prima"],["rotto","Qualcosa comprato in negozio o online che si è rotto"],["nessuno","Niente di questo"]] },
];
const ETA_MIN = { u20:0, "20_30":20, "31_64":31, "65_74":65, "75":75 };

const app = document.getElementById("app");
const parametri = new URLSearchParams(location.search);
const pagato = parametri.get("k") === CONFIG.codice;
let risposte = carica() || {};
let passo = 0;

function carica() { try { return JSON.parse(localStorage.getItem(CHIAVE_SALVATAGGIO)); } catch (e) { return null; } }
function salva() { try { localStorage.setItem(CHIAVE_SALVATAGGIO, JSON.stringify(risposte)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tutte = () => DOMANDE.every(d => d.multi ? (risposte[d.id] || []).length : risposte[d.id]);

// --- regole: ogni condizione della voce deve essere vera ---
function vale(cond) {
  const r = risposte, isee = r.isee;
  for (const [k, v] of Object.entries(cond)) {
    if (k === "figli" && !(r.figli || []).includes(v)) return false;
    if (k === "evento" && !(r.evento || []).includes(v)) return false;
    if (k === "studio" && r.studio !== v) return false;
    if (k === "isee" && isee !== v) return false;
    if (k === "isee_max" && !(isee !== "no" && isee !== "oltre" && Number(isee) <= v)) return false;
    if (k === "persone_min" && Number(r.persone) < v) return false;
    if (k === "eta_min" && ETA_MIN[r.eta] < v) return false;
  }
  return true;
}
function risultati() {
  const out = [];
  for (const v of DATI.voci) {
    const regola = v.regole.find(x => vale(x.se));
    if (regola) out.push({ ...v, esito: regola.esito });
  }
  return out.sort((a, b) => (a.esito === "si" ? 0 : 1) - (b.esito === "si" ? 0 : 1));
}

// --- schermate ---
function inizio() {
  app.innerHTML = `
    <p class="occhiello">Papillon Verde · 2026</p>
    <h1 style="margin-top:10px">Nessuno ti avvisa dei soldi che ti spettano. <em>Te lo diciamo noi.</em></h1>
    <p class="sotto">Rispondi a 6 domande, in 2 minuti, e scopri quali bonus, sconti e rimborsi possono spettare a te. È gratis.</p>
    <div class="card">
      <div class="passi">
        <div><b>1</b><span>Rispondi a 6 domande sulla tua situazione</span></div>
        <div><b>2</b><span>Vedi subito, gratis, quali voci fanno per te</span></div>
        <div><b>3</b><span>Se vuoi, ricevi il resoconto completo: passi da fare, scadenze e lettere già pronte</span></div>
      </div>
      <button class="btn" id="via">Inizia: è gratis</button>
      <p class="nota">🔒 Le risposte restano sul tuo telefono: non le riceviamo e non le salviamo da nessuna parte. Nessun documento, nessun numero esatto.</p>
    </div>
    <footer>15 voci verificate sui siti ufficiali (Inps, ARERA, Agenzia delle Entrate, Banca d'Italia, Unione europea), aggiornate al ${esc(DATI.verifica)}.<br>Informazioni generali, non consulenza legale o fiscale.</footer>`;
  document.getElementById("via").onclick = () => { passo = 0; domanda(); };
}

function domanda() {
  const d = DOMANDE[passo];
  const scelto = d.multi ? (risposte[d.id] || []) : risposte[d.id];
  app.innerHTML = `
    <div class="progresso" aria-hidden="true"><i style="width:${(passo / DOMANDE.length) * 100}%"></i></div>
    <p class="occhiello">Domanda ${passo + 1} di ${DOMANDE.length}</p>
    <h2 style="margin-top:8px">${esc(d.titolo)}</h2>
    ${d.sotto ? `<p class="sotto">${esc(d.sotto)}</p>` : ""}
    <div class="scelte" role="group" aria-label="${esc(d.titolo)}">
      ${d.scelte.map(([v, t]) => `<button class="scelta${d.multi ? " multi" : ""}" data-v="${v}" aria-pressed="${d.multi ? scelto.includes(v) : scelto === v}"><span class="segno"></span>${esc(t)}</button>`).join("")}
    </div>
    ${d.multi ? `<button class="btn" id="avanti" ${scelto.length ? "" : "disabled"}>Avanti</button>` : ""}
    <button class="indietro" id="indietro">← Indietro</button>`;
  app.querySelectorAll(".scelta").forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (!d.multi) { risposte[d.id] = v; salva(); avanti(); return; }
    let lista = (risposte[d.id] || []).filter(x => x !== "nessuno");
    if (v === "nessuno") lista = ["nessuno"];
    else lista = lista.includes(v) ? lista.filter(x => x !== v) : [...lista, v];
    risposte[d.id] = lista; salva(); domanda();
  });
  const av = document.getElementById("avanti"); if (av) av.onclick = avanti;
  document.getElementById("indietro").onclick = () => { if (passo === 0) inizio(); else { passo--; domanda(); } };
  window.scrollTo(0, 0);
}
function avanti() { if (passo < DOMANDE.length - 1) { passo++; domanda(); } else (pagato ? chiediNome() : anteprima()); }

function voceBreve(v) {
  return `<div class="voce"><div class="testa"><div><h3>${v.icona} ${esc(v.titolo)}</h3><p class="cifra">${esc(v.cifra)}</p></div>
    <span class="etichetta ${v.esito}">${v.esito === "si" ? "Fa per te" : "Da controllare"}</span></div>
    <div class="chiuso">🔒 Chi, quanto, come chiederlo, scadenza${v.lettera ? " e lettera pronta" : ""}: nel resoconto completo</div></div>`;
}
function senzaIsee() {
  return risposte.isee === "no" ? `<div class="riquadro"><b>Il passo che sblocca quasi tutto: fai l'Isee.</b> È gratis al CAF o sul sito Inps. Senza, molte voci (bonus in bolletta, TARI, conto gratis, carta da 500 €) non arrivano.</div>` : "";
}

function anteprima() {
  const lista = risultati();
  const si = lista.filter(v => v.esito === "si").length;
  app.innerHTML = lista.length ? `
    <p class="occhiello">Il tuo risultato</p>
    <h1 style="margin-top:8px">Abbiamo trovato <em>${lista.length} ${lista.length === 1 ? "voce" : "voci"}</em> per te.</h1>
    <p class="sotto">${si} ${si === 1 ? "fa" : "fanno"} quasi sicuramente per te${lista.length - si ? `, ${lista.length - si} ${lista.length - si === 1 ? "è" : "sono"} da controllare` : ""}.</p>
    ${senzaIsee()}
    <div class="card">${lista.map(voceBreve).join("")}</div>
    <div class="card">
      <h2>Il tuo resoconto completo</h2>
      <ul style="margin:12px 0 0 20px; display:grid; gap:6px">
        <li>Per ogni voce: chi può averla, quanto vale, <b>come chiederla</b>, la <b>scadenza</b> e il link ufficiale</li>
        <li>I passi da fare adesso, uno per uno</li>
        <li><b>Le lettere già pronte</b> con il tuo nome, dove servono</li>
        <li>Il tuo calendario delle scadenze</li>
        <li>In PDF, da tenere sul telefono</li>
      </ul>
      ${CONFIG.linkAcquisto ? `<a class="btn oro" href="${esc(CONFIG.linkAcquisto)}">Ricevi il tuo resoconto completo</a>`
        : `<button class="btn oro" disabled>Ricevi il tuo resoconto completo (in arrivo)</button>`}
      <p class="nota">Lo apri subito dopo il pagamento, da questo telefono. Contenuto digitale consegnato subito: al pagamento rinunci al diritto di recesso. Se il file non si apre, te lo sistemiamo.</p>
    </div>
    <button class="btn vuoto" id="rifai">Rifai le domande</button>
    <footer>Informazioni generali, non consulenza legale o fiscale. Le risposte restano sul tuo telefono.</footer>`
  : `
    <p class="occhiello">Il tuo risultato</p>
    <h1 style="margin-top:8px">Per ora non abbiamo trovato voci per te.</h1>
    ${senzaIsee()}
    <p class="sotto">Non devi pagare niente. Se la tua situazione cambia (un figlio, un trasloco, un volo in ritardo), rifai le domande.</p>
    <button class="btn vuoto" id="rifai">Rifai le domande</button>`;
  document.getElementById("rifai").onclick = () => { risposte = {}; salva(); passo = 0; domanda(); };
  window.scrollTo(0, 0);
}

// --- resoconto completo (dopo l'acquisto) ---
function chiediNome() {
  app.innerHTML = `
    <p class="occhiello">Grazie!</p>
    <h1 style="margin-top:8px">Prepariamo il <em>tuo</em> resoconto.</h1>
    <p class="sotto">Il nome e l'indirizzo servono solo per scriverli nelle lettere pronte. Restano su questo telefono.</p>
    <div class="card">
      <label for="nome">Nome e cognome</label><input type="text" id="nome" autocomplete="name" value="${esc(risposte.nome || "")}">
      <label for="ind">Indirizzo di residenza <span class="piccolo">(facoltativo)</span></label><input type="text" id="ind" autocomplete="street-address" value="${esc(risposte.indirizzo || "")}">
      <button class="btn" id="fatto">Mostra il mio resoconto</button>
      <button class="indietro" id="rifai">Rifai le 6 domande</button>
    </div>`;
  document.getElementById("fatto").onclick = () => {
    risposte.nome = document.getElementById("nome").value.trim();
    risposte.indirizzo = document.getElementById("ind").value.trim();
    salva(); resoconto();
  };
  document.getElementById("rifai").onclick = () => { passo = 0; domanda(); };
}

function riempi(t) {
  return esc(t).replace("{{NOME}}", esc(risposte.nome || "…………")).replace("{{INDIRIZZO}}", esc(risposte.indirizzo || "…………"));
}
function voceIntera(v) {
  const righe = [["Chi", v.chi], ["Quanto", v.quanto], ["Come", v.come], ["Entro quando", v.quando], ["Attenzione", v.attenzione]].filter(r => r[1]);
  return `<div class="voce"><div class="testa"><div><h3>${v.icona} ${esc(v.titolo)}</h3><p class="cifra">${esc(v.cifra)} · ${esc(v.tipo)}</p></div>
    <span class="etichetta ${v.esito}">${v.esito === "si" ? "Fa per te" : "Da controllare"}</span></div>
    <dl class="dettagli">${righe.map(([k, t]) => `<dt>${k}</dt><dd>${t}</dd>`).join("")}
      <dt>Cosa fare adesso</dt><dd><ol>${v.passi.map(p => `<li>${esc(p)}</li>`).join("")}</ol></dd></dl>
    <p class="fonti">Fonti: ${v.fonti.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.nome)}</a>`).join(" · ")}</p></div>`;
}
function letteraHtml(l) {
  return `<div class="lettera"><p class="occhiello">Lettera pronta · ${esc(l.titolo)}</p>
    <p><b>A:</b> ${riempi(l.dest)}</p><p><b>Oggetto:</b> ${riempi(l.oggetto)}</p>
    ${l.corpo.map(p => `<p>${riempi(p)}</p>`).join("")}
    <p>Distinti saluti,<br>${esc(risposte.nome || "…………")}</p>
    <p class="piccolo">Allegati: ${esc(l.allegati)}. Completa i punti «…………», poi mandala con PEC o raccomandata e tieni la ricevuta.</p></div>`;
}
function resoconto() {
  const lista = risultati();
  const lettere = DATI.lettere.filter(l => lista.some(v => v.lettera === l.id));
  const oggi = new Date().toLocaleDateString("it-IT", { day:"numeric", month:"long", year:"numeric" });
  app.innerHTML = `
    <p class="occhiello">Resoconto personale · ${esc(oggi)}</p>
    <h1 style="margin-top:8px">${risposte.nome ? esc(risposte.nome) + ", ecco" : "Ecco"} <em>cosa spetta a te</em>.</h1>
    <p class="sotto">${lista.length} ${lista.length === 1 ? "voce" : "voci"} in base alle tue risposte. Dati verificati sui siti ufficiali al ${esc(DATI.verifica)}.</p>
    <div class="no-stampa"><button class="btn oro" id="pdf">Salva come PDF</button>
      <p class="nota">Sull'iPhone: tocca il bottone, poi l'icona di condivisione (□↑) e «Salva su File». Su Android: «Salva come PDF».</p></div>
    ${senzaIsee()}
    <div class="card">${lista.map(voceIntera).join("") || "<p>Per ora nessuna voce: rifai le domande se la tua situazione cambia.</p>"}</div>
    ${lettere.length ? `<div class="card"><h2>Le tue lettere pronte</h2>${lettere.map(letteraHtml).join("")}</div>` : ""}
    <div class="card"><h2>Le scadenze da segnare</h2><div class="cal" style="margin-top:10px">${DATI.calendario.map(c => `<div><b>${esc(c.quando)}</b><span>${esc(c.cosa)}</span></div>`).join("")}</div></div>
    <div class="card no-stampa"><h2>Vuoi tutte le 15 voci?</h2><p class="sotto">La Mappa dei soldi 2026 le ha tutte, con i moduli da compilare sul telefono.</p>
      <a class="btn vuoto" href="${esc(CONFIG.linkMappa)}">Vedi la Mappa</a></div>
    <button class="indietro no-stampa" id="rifai">Rifai le domande</button>
    <footer>Papillon Verde · Informazioni generali, non consulenza legale o fiscale. Controlla sempre il link ufficiale di ogni voce.</footer>`;
  document.getElementById("pdf").onclick = () => window.print();
  document.getElementById("rifai").onclick = () => { passo = 0; domanda(); };
  window.scrollTo(0, 0);
}

if (pagato) { tutte() ? chiediNome() : (passo = 0, domanda()); } else { inizio(); }
</script>
</body>
</html>
